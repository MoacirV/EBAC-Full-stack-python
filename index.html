<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atividade JS</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background-color: rgb(0, 0, 0);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
      }

      .container {
        color: white;
        padding: 2rem;
        background-color: rgb(235, 34, 67);
        border-radius: 10px;
        width: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }

      form {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
      }

      form input {
        text-align: center;
        width: 100%;
        height: 40px;
      }

      form button {
        width: 100%;
        height: 35px;
        font-weight: bold;
      }

      .error-message {
        text-align: center;
        background-color: rgb(226, 70, 43);
        display: none;
      }

      form input.error {
        color: yellow;
        border-color: yellow;
        outline-color: yellow;
      }

      .btn-padrao{
        background-color: rgb(162, 194, 162);
        border: none;
      }

      .btn{
        color: white;
        background-color: rgb(6, 165, 6);
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Cadastro de Tutor</h1>
      <form id="form-creche">
        <input
          type="text"
          placeholder="Nome do aluno"
          required
          id="name-baby"
        />
        <input
          type="number"
          placeholder="Idade do aluno"
          required
          id="age-baby"
        />
        <input
          type="text"
          placeholder="Nome do tutor"
          required
          id="name-tutor"
        />
        <input
          type="number"
          placeholder="Idade do tutor"
          required
          id="age-tutor"
        />
        <p class="error-message">
          O tutor precisa ter mais idade que a criança
        </p>
        <button type="submit" id="submit-btn" class="btn-padrao">Enviar</button>

    </div>
    <script>
      const form = document.getElementById("form-creche");
      const ageBaby = document.getElementById("age-baby");
      const ageTutor = document.getElementById("age-tutor");
      const nameBaby = document.getElementById("name-baby");
      const nameTutor = document.getElementById("name-tutor");
      const button = document.getElementById("submit-btn");
      const errorMessage = document.querySelector('.error-message');

      function validaAge(ageOne, ageTwo) {
        return ageOne < ageTwo;
      }

      form.addEventListener("submit", function (e) {
        tutorMaior = false;
        e.preventDefault();
        const idadeBaby = Number(ageBaby.value);
        const idadeTutor = Number(ageTutor.value);
        const nameBaby = document.getElementById("name-baby");
        const nameTutor = document.getElementById("name-tutor");
        tutorMaior = validaAge(idadeBaby, idadeTutor);

        if (tutorMaior === true) {
          document.querySelector(".error-message").style.display = "none";

          nameBaby.value = "";
          ageBaby.value = "";
          nameTutor.value = "";
          ageTutor.value = "";
        } else {
          document.querySelector(".error-message").style.display = "block";
        }

        console.log(`o resultado é ${validaAge(idadeBaby, idadeTutor)}`);

        });

        ageTutor.addEventListener("keyup", function (e) {
          const idadeBaby = Number(ageBaby.value);
          const idadeTutorAtual = Number(e.target.value);
          const tutorMaior = validaAge(idadeBaby, idadeTutorAtual);

          if (!tutorMaior) {
            ageTutor.classList.add("error");
            button.classList.remove("btn");
            errorMessage.style.display = "block";
          } else {
            ageTutor.classList.remove("error");
            button.classList.add("btn");
            errorMessage.style.display = "none";
          }
        });
    </script>
  </body>
</html>
